<div class="container">
    <div class="chart-box">
    	<div class ="card">
        	<!-- 막대 그래프 -->	
			<div class="chart-wrapper bar-wrapper">
			    <h3>구독자 수 Top 7 상품</h3>
			    <canvas id="barChart"></canvas>
			</div>
		</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script>

	const barLabels = ["\uAE30\uAC00 \uC778\uD130\uB137 500M","U+ \uC2A4\uB9C8\uD2B8\uD648","\uD734\uB300\uD3F0 \uBD84\uC2E4\uD30C\uC190 \uBCF4\uD5D8","V\uCEEC\uB7EC\uB9C1","\uB85C\uBC0D \uB370\uC774\uD130 \uD328\uC2A4","U+tv \uBCA0\uC774\uC9C1","U+tv \uD504\uB9AC\uBBF8\uC5C4"];
    const barData = [4240,4040,4030,3998,3913,2827,2780];

    new Chart(document.getElementById('barChart'), {
        type: 'bar',
        data: {
            labels: barLabels,
            datasets: [{
                label: '구독자 수',
                data: barData,
                backgroundColor: ['#c7d2fe', '#c7d2fe', '#c7d2fe', '#fcd34d', '#fda4af', '#a5f3fc', '#6ee7b7'],
                borderColor: '#f9fafb',      // 테두리 색 (선택)
                borderWidth: 1
            }]
        },
        options: {
            maintainAspectRatio: false,
            scales: {
                y: {
                    min: 40000,
                    max: 80000,
                    ticks: {
                        stepSize: 5000,
                        callback: value => value.toLocaleString()
                    }
                }
            },
            plugins: {
                tooltip: {
                    callbacks: {
                        label: ctx =>
                            `구독자 수: ${ctx.raw.toLocaleString()}`
                    }
                },
                legend: {
                    display: false
                }
            }
        }
    });
</script>
