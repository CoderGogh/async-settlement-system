<div class="container">
	<h1>상품 유형별 구독 비율</h1>
	<div class="chart-grid">
		<div class="card">
			<div class="chart-wrapper donut-wrapper">
				<h3>mobile 상품 구독 비율</h3>
				<canvas id="donutChart_0"></canvas>
			</div>
		</div>
		<div class="card">
			<div class="chart-wrapper donut-wrapper">

			</div>
		</div>
		<div class="card">
			<div class="chart-wrapper donut-wrapper">

		</div>
		<div class="card">
			<div class="chart-wrapper donut-wrapper">
				<h3>addon 상품 구독 비율</h3>

			</div>
		</div>
	</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

    const charts = [{"productType":"mobile","title":"mobile \uC0C1\uD488 \uAD6C\uB3C5 \uBE44\uC728","labels":["5G \uC2A4\uD0E0\uB2E4\uB4DC","5G \uB77C\uC774\uD2B8+","5G \uD504\uB9AC\uBBF8\uC5B4 \uC5D0\uC13C\uC15C","5G \uC2AC\uB9BC+","LTE \uB370\uC774\uD13033","5G \uD504\uB9AC\uBBF8\uC5B4 \uC288\uD37C"],"data":[4846,3881,3598,2997,2366,1997]},{"productType":"internet","title":"internet \uC0C1\uD488 \uAD6C\uB3C5 \uBE44\uC728","labels":["\uAE30\uAC00 \uC778\uD130\uB137 500M","\uAE30\uAC00 \uC778\uD130\uB137 1G","\uC778\uD130\uB137 100M"],"data":[4240,2084,2048]},{"productType":"iptv","title":"iptv \uC0C1\uD488 \uAD6C\uB3C5 \uBE44\uC728","labels":["U+tv \uBCA0\uC774\uC9C1","U+tv \uD504\uB9AC\uBBF8\uC5C4"],"data":[2827,2780]},{"productType":"addon","title":"addon \uC0C1\uD488 \uAD6C\uB3C5 \uBE44\uC728","labels":["U+ \uC2A4\uB9C8\uD2B8\uD648","\uD734\uB300\uD3F0 \uBD84\uC2E4\uD30C\uC190 \uBCF4\uD5D8","V\uCEEC\uB7EC\uB9C1","\uB85C\uBC0D \uB370\uC774\uD130 \uD328\uC2A4"],"data":[4040,4030,3998,3913]}];

    /* ===== 공통 색상 ===== */
    const donutColors = [
      '#ff6b6b',
      '#4fc3f7',
      '#ffd166',
      '#6c63ff',
      '#4dd0a3',
      '#ff9f1c',
      '#a0cded',
      '#c77dff',
      '#2ec4b6',
      '#e76f51'
    ];

    /* ===== 차트 생성 ===== */
    charts.forEach((chart, index) => {

        const total = chart.data.reduce((sum, v) => sum + v, 0);

        new Chart(
            document.getElementById(`donutChart_${index}`),
            {
                type: 'doughnut',
                data: {
                    labels: chart.labels,
                    datasets: [{
                        data: chart.data,
                        backgroundColor: donutColors,
                        borderColor: '#ffffff',
                        borderWidth: 2,
                        hoverOffset: 12
                    }]
                },
                options: {
                    responsive: false,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        },
                        tooltip: {
                            callbacks: {
                                label: function (context) {
                                    const value = context.raw;
                                    const percent = ((value / total) * 100).toFixed(1);
                                    return `${context.label} : ${value}명 (${percent}%)`;
                                }
                            }
                        }
                    }
                }
            }
        );
    });
</script>
