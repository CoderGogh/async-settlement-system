<div class="container">
    <h1>메시지 발송 현황</h1>
  <div class="month">
		    <span class="step-card">
		        <i class="bi bi-calendar-event"></i>
		        정산월: <span id="settlementMonth">2025-12</span>
		    </span>
		</div>
		
		<div class="step-row">
		    <span class="step-card">
		        <i class="bi bi-bar-chart-line"></i>
		        총 데이터: <span id="totalCount">19998</span>건
		    </span>
		</div>
		<br>
	<div class="card">
        <!-- 이메일 WAITED -->
        <div class="section">
            <div class="section-title">
                <span>이메일 발송 대기 건</span>
                <span class="rate">
                    <span id="waitCount">0</span>건
                    · <span id="waitRate">0.00</span>%
                </span>
            </div>
            <div class="bar-wrap">
                <div id="waitBar" class="bar wait" style="width:0.0%"></div>
            </div>
        </div>

        <!-- 이메일 SENT -->
        <div class="section">
            <div class="section-title">
                <span>이메일 발송 성공 건</span>
                <span class="rate">
                    <span id="sentCount">19998</span>건
                    · <span id="sentRate">100.00</span>%
                </span>
            </div>
            <div class="bar-wrap">
                <div id="sentBar" class="bar sent" style="width:100.0%"></div>
            </div>
        </div>

        <!-- 이메일 RETRY -->
        <div class="section">
            <div class="section-title">
                <span>이메일 재발송 대기 건</span>
                <span class="rate">
                    <span id="retryCount">0</span>건
                    · <span id="retryRate">0.00</span>%
                </span>
            </div>
            <div class="bar-wrap">
                <div id="retryBar" class="bar retry" style="width:0.0%"></div>
            </div>
        </div>

       <!-- SMS -->
		<div class="section">
		    <div class="section-title">
		        <span>SMS 발송 건</span>
		        <span class="rate">
		            <span id="smsCount">0</span>건
		            · <span id="smsRate">0.00</span>%
		        </span>
		    </div>
		    <div class="bar-wrap">
		        <div id="smsBar" class="bar sms" style="width:0.0%"></div>
		    </div>
		</div>


        <!-- FAIL -->
        <div class="section">
            <div class="section-title">
                <span>메시지 발송 실패 건</span>
                <span class="rate">
                    <span id="failCount">0</span>건
                    · <span id="failRate">0.00</span>%
                </span>
            </div>
            <div class="bar-wrap">
                <div id="failBar" class="bar fail" style="width:0.0%"></div>
            </div>
        </div>
    </div>
</div>

<script>
function updateStatus(id, status) {
    const el = document.getElementById(id);
    if(!el) return;
    el.textContent = status;
    el.classList.remove('pending','done','fail');
    el.classList.add(status.toLowerCase());
}

const eventSource = new EventSource('/admin/process/stream');
eventSource.onmessage = function(event) {
    const data = JSON.parse(event.data);
    updateStatus('batchJob', data.batchJob);
    updateStatus('batchKafkaSent', data.batchKafkaSent);
    updateStatus('messageKafkaReceive', data.messageKafkaReceive);
    updateStatus('messageCreateMessage', data.messageCreateMessage);
    updateStatus('messageSentMessage', data.messageSentMessage);
};
</script>
